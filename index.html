<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Net Simulizi — Admin</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0
}

:root{
--bg:#090b10;
--surface:#11141b;
--surface-2:#171b24;
--gold:#e5a51c;
--gold-light:#f2bd3d;
--text:#fff;
--muted:#a8afbd;
--border:rgba(255,255,255,.09)
}

html{
scroll-behavior:smooth
}

body{
font-family:Arial,Helvetica,sans-serif;
background:var(--bg);
color:var(--text);
line-height:1.5;
min-height:100vh
}

button,
input,
select{
font:inherit
}

button,
a{
-webkit-tap-highlight-color:transparent
}

a{
text-decoration:none;
color:inherit
}

/* =========================
LANGUAGE SCREEN
========================= */

#languageScreen{
position:fixed;
inset:0;
z-index:9999;
background:
radial-gradient(
circle at 50% 30%,
rgba(229,165,28,.13),
transparent 32%
),
#090b10;
display:flex;
align-items:center;
justify-content:center;
padding:25px
}

#languageScreen.hidden{
display:none !important;
visibility:hidden !important;
pointer-events:none !important
}

.language-container{
width:100%;
max-width:520px;
text-align:center
}

.language-logo{
width:125px;
height:125px;
object-fit:contain;
margin:0 auto 25px;
display:block
}

.language-brand{
font-size:34px;
font-weight:900;
margin-bottom:8px
}

.language-brand span{
color:var(--gold)
}

.language-subtitle{
color:var(--muted);
margin-bottom:38px;
font-size:15px
}

.language-title{
font-size:19px;
margin-bottom:18px
}

.language-options{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px
}

.language-option{
border:1px solid var(--border);
background:var(--surface);
color:white;
border-radius:14px;
padding:22px 15px;
cursor:pointer;
transition:.2s
}

.language-option:hover{
border-color:var(--gold);
transform:translateY(-3px);
background:var(--surface-2)
}

.language-option strong{
display:block;
font-size:17px;
margin-bottom:5px
}

.language-option small{
color:var(--muted)
}

/* =========================
ADMIN SCREEN
========================= */

#adminScreen{
position:fixed;
inset:0;
z-index:9000;
background:
radial-gradient(
circle at 50% 30%,
rgba(229,165,28,.13),
transparent 32%
),
#090b10;
display:none;
align-items:center;
justify-content:center;
padding:25px;
min-height:100vh
}

#adminScreen.active{
display:flex
}

.admin-container{
width:100%;
max-width:520px;
text-align:center
}

.admin-logo{
width:180px;
height:180px;
object-fit:contain;
margin:0 auto 30px;
display:block
}

.admin-brand{
font-size:42px;
font-weight:900;
margin-bottom:50px;
letter-spacing:2px
}

.admin-brand span{
color:var(--gold)
}

.admin-login-btn{
border:0;
border-radius:12px;
padding:16px 48px;
cursor:pointer;
font-weight:900;
font-size:18px;
transition:.2s;
background:var(--gold);
color:#111
}

.admin-login-btn:hover{
background:var(--gold-light);
transform:translateY(-3px)
}

/* =========================
RESPONSIVE
========================= */

@media(max-width:760px){

.admin-logo{
width:140px;
height:140px
}

.admin-brand{
font-size:32px
}

.language-options{
grid-template-columns:1fr
}

}

@media(max-width:420px){

.admin-logo{
width:110px;
height:110px
}

.admin-brand{
font-size:26px
}

.admin-login-btn{
padding:14px 36px;
font-size:16px
}

}
</style>
</head>

<body>

<!-- =========================
LANGUAGE SCREEN
========================= -->

<div id="languageScreen">

<div class="language-container">

<img
src="Logo.png"
alt="Net Simulizi Logo"
class="language-logo"
>

<div class="language-brand">
NET <span>SIMULIZI</span>
</div>

<p class="language-subtitle">
Hadithi Zako. Ulimwengu Wako.
</p>

<h2 class="language-title">
Chagua lugha / Choose your language
</h2>

<div class="language-options">

<button
class="language-option"
onclick="selectLanguage('sw')"
>

<strong>🇹🇿 Kiswahili</strong>

<small>
Endelea kwa Kiswahili
</small>

</button>

<button
class="language-option"
onclick="selectLanguage('en')"
>

<strong>🇬🇧 English</strong>

<small>
Continue in English
</small>

</button>

</div>

</div>

</div>

<!-- =========================
ADMIN SCREEN
========================= -->

<div id="adminScreen">

<div class="admin-container">

<img
src="Logo.png"
alt="Net Simulizi Logo"
class="admin-logo"
>

<div class="admin-brand">
NET <span>SIMULIZI</span>
</div>

<button
class="admin-login-btn"
onclick="window.location.href='admin-login.html'"
>
Admin Login
</button>

</div>

</div>

<script>

/* =========================
LANGUAGE
========================= */

function selectLanguage(language){

localStorage.setItem(
"netsimulizi_language",
language
);

const languageScreen =
document.getElementById(
"languageScreen"
);

if(languageScreen){
languageScreen.classList.add("hidden");
}

showAdminScreen();

}

/* =========================
SHOW ADMIN SCREEN
========================= */

function showAdminScreen(){

const adminScreen =
document.getElementById("adminScreen");

const savedLanguage =
localStorage.getItem("netsimulizi_language");

if(savedLanguage){
adminScreen.classList.add("active");
}

}

/* =========================
PAGE LOAD
========================= */

window.addEventListener(
"DOMContentLoaded",
function(){

const savedLanguage =
localStorage.getItem("netsimulizi_language");

const languageScreen =
document.getElementById("languageScreen");

if(savedLanguage){
if(languageScreen){
languageScreen.classList.add("hidden");
}
showAdminScreen();
}else{
if(languageScreen){
languageScreen.classList.remove("hidden");
}
}

}
);

</script>

</body>
</html>
