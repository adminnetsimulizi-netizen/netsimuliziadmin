<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Net Simulizi — Admin</title>

<style>
*{
box-sizing:border-box;
margin:0;
padding:0
}

:root{
--bg:#090b10;
--surface:#11141b;
--surface-2:#171b24;
--gold:#e5a51c;
--gold-light:#f2bd3d;
--text:#fff;
--muted:#a8afbd;
--border:rgba(255,255,255,.09)
}

html{
scroll-behavior:smooth
}

body{
font-family:Arial,Helvetica,sans-serif;
background:var(--bg);
color:var(--text);
line-height:1.5;
min-height:100vh
}

button,
input,
select{
font:inherit
}

button,
a{
-webkit-tap-highlight-color:transparent
}

a{
text-decoration:none;
color:inherit
}

/* =========================
LANGUAGE SCREEN
========================= */

#languageScreen{
position:fixed;
inset:0;
z-index:9999;
background:
radial-gradient(
circle at 50% 30%,
rgba(229,165,28,.13),
transparent 32%
),
#090b10;
display:flex;
align-items:center;
justify-content:center;
padding:25px
}

#languageScreen.hidden{
display:none !important;
visibility:hidden !important;
pointer-events:none !important
}

.language-container{
width:100%;
max-width:520px;
text-align:center
}

.language-logo{
width:125px;
height:125px;
object-fit:contain;
margin:0 auto 25px;
display:block
}

.language-brand{
font-size:34px;
font-weight:900;
margin-bottom:8px
}

.language-brand span{
color:var(--gold)
}

.language-subtitle{
color:var(--muted);
margin-bottom:38px;
font-size:15px
}

.language-title{
font-size:19px;
margin-bottom:18px
}

.language-options{
display:grid;
grid-template-columns:1fr 1fr;
gap:14px
}

.language-option{
border:1px solid var(--border);
background:var(--surface);
color:white;
border-radius:14px;
padding:22px 15px;
cursor:pointer;
transition:.2s
}

.language-option:hover{
border-color:var(--gold);
transform:translateY(-3px);
background:var(--surface-2)
}

.language-option strong{
display:block;
font-size:17px;
margin-bottom:5px
}

.language-option small{
color:var(--muted)
}

/* =========================
ADMIN SCREEN
========================= */

#adminScreen{
position:fixed;
inset:0;
z-index:9000;
background:
radial-gradient(
circle at 50% 30%,
rgba(229,165,28,.13),
transparent 32%
),
#090b10;
display:none;
align-items:center;
justify-content:center;
padding:25px;
min-height:100vh
}

#adminScreen.active{
display:flex
}

.admin-container{
width:100%;
max-width:520px;
text-align:center
}

.admin-logo{
width:180px;
height:180px;
object-fit:contain;
margin:0 auto 30px;
display:block
}

.admin-brand{
font-size:42px;
font-weight:900;
margin-bottom:50px;
letter-spacing:2px
}

.admin-brand span{
color:var(--gold)
}

.admin-login-btn{
border:0;
border-radius:12px;
padding:16px 48px;
cursor:pointer;
font-weight:900;
font-size:18px;
transition:.2s;
background:var(--gold);
color:#111
}

.admin-login-btn:hover{
background:var(--gold-light);
transform:translateY(-3px)
}

/* =========================
MODAL
========================= */

.modal{
position:fixed;
inset:0;
z-index:5000;
display:none;
align-items:center;
justify-content:center;
padding:20px;
background:rgba(0,0,0,.8)
}

.modal.active{
display:flex
}

.modal-box{
width:100%;
max-width:430px;
position:relative;
padding:28px;
border-radius:15px;
border:1px solid var(--border);
background:var(--surface);
max-height:90vh;
overflow-y:auto
}

.close-modal{
position:absolute;
right:15px;
top:10px;
border:0;
background:transparent;
color:#aaa;
font-size:25px;
cursor:pointer
}

.modal-box h2{
margin-bottom:7px
}

.modal-description{
color:var(--muted);
font-size:13px;
margin-bottom:22px
}

.form-group{
margin-bottom:15px
}

.form-group label{
display:block;
margin-bottom:6px;
font-size:13px;
font-weight:700;
color:#d9dce4
}

.form-group input{
width:100%;
height:45px;
padding:0 13px;
border-radius:8px;
border:1px solid #303541;
background:#0d0f15;
color:white;
outline:none
}

.form-group input:focus{
border-color:var(--gold)
}

.submit-btn{
width:100%;
margin-top:5px;
background:var(--gold);
color:#111
}

.submit-btn:disabled{
opacity:.6;
cursor:not-allowed
}

.auth-message{
display:none;
margin-bottom:15px;
padding:11px 12px;
border-radius:8px;
font-size:13px;
background:#191d26;
border:1px solid var(--border)
}

.auth-message.show{
display:block
}

.auth-message.error{
color:#ffb4b4;
border-color:#7b3030
}

.auth-message.success{
color:#b8f5c8;
border-color:#28643a
}

/* =========================
RESPONSIVE
========================= */

@media(max-width:760px){

.admin-logo{
width:140px;
height:140px
}

.admin-brand{
font-size:32px
}

.language-options{
grid-template-columns:1fr
}

}

@media(max-width:420px){

.admin-logo{
width:110px;
height:110px
}

.admin-brand{
font-size:26px
}

.admin-login-btn{
padding:14px 36px;
font-size:16px
}

}
</style>
</head>

<body>

<!-- =========================
LANGUAGE SCREEN
========================= -->

<div id="languageScreen">

<div class="language-container">

<img
src="Logo.png"
alt="Net Simulizi Logo"
class="language-logo"
>

<div class="language-brand">
NET <span>SIMULIZI</span>
</div>

<p class="language-subtitle">
Hadithi Zako. Ulimwengu Wako.
</p>

<h2 class="language-title">
Chagua lugha / Choose your language
</h2>

<div class="language-options">

<button
class="language-option"
onclick="selectLanguage('sw')"
>

<strong>🇹🇿 Kiswahili</strong>

<small>
Endelea kwa Kiswahili
</small>

</button>

<button
class="language-option"
onclick="selectLanguage('en')"
>

<strong>🇬🇧 English</strong>

<small>
Continue in English
</small>

</button>

</div>

</div>

</div>

<!-- =========================
ADMIN SCREEN
========================= -->

<div id="adminScreen">

<div class="admin-container">

<img
src="Logo.png"
alt="Net Simulizi Logo"
class="admin-logo"
>

<div class="admin-brand">
NET <span>SIMULIZI</span>
</div>

<button
class="admin-login-btn"
onclick="openAuth('login')"
id="adminLoginBtn"
>
Admin Login
</button>

</div>

</div>

<!-- =========================
AUTH MODAL
========================= -->

<div
class="modal"
id="authModal"
>

<div class="modal-box">

<button
class="close-modal"
onclick="closeAuth()"
>
×
</button>

<div id="loginForm">

<h2>
Admin Login
</h2>

<p class="modal-description">
Ingia kwenye akaunti yako ya admin.
</p>

<div
id="loginMessage"
class="auth-message"
>
</div>

<div class="form-group">

<label>
Email au Username
</label>

<input
id="homeLogin"
type="text"
placeholder="Email au username"
autocomplete="username"
>

</div>

<div class="form-group">

<label>
Password
</label>

<input
id="homeLoginPassword"
type="password"
placeholder="Password"
autocomplete="current-password"
>

</div>

<button
id="homeLoginButton"
class="btn submit-btn"
onclick="homeLogin()"
>
Login
</button>

</div>

</div>

</div>

<script>

/* =========================
API
========================= */

const API_BASE = "/api";

/* =========================
LANGUAGE
========================= */

function selectLanguage(language){

localStorage.setItem(
"netsimulizi_language",
language
);

const languageScreen =
document.getElementById(
"languageScreen"
);

if(languageScreen){
languageScreen.classList.add("hidden");
}

showAdminScreen();

}

/* =========================
SHOW ADMIN SCREEN
========================= */

function showAdminScreen(){

const adminScreen =
document.getElementById("adminScreen");

const savedLanguage =
localStorage.getItem("netsimulizi_language");

if(savedLanguage){
adminScreen.classList.add("active");
}

}

/* =========================
AUTH MODAL
========================= */

function openAuth(type){

document.getElementById("authModal").classList.add("active");

clearAuthMessages();

}

function closeAuth(){

document.getElementById("authModal").classList.remove("active");

}

function showAuthMessage(id,message,type){

const element =
document.getElementById(id);

if(!element){
return;
}

element.textContent = message;
element.className = "auth-message show " + type;

}

function clearAuthMessages(){

const loginMessage =
document.getElementById("loginMessage");

if(loginMessage){
loginMessage.textContent = "";
loginMessage.className = "auth-message";
}

}

/* =========================
LOGIN
========================= */

async function homeLogin(){

const login =
document.getElementById("homeLogin").value.trim();

const password =
document.getElementById("homeLoginPassword").value;

const button =
document.getElementById("homeLoginButton");

if(!login || !password){

showAuthMessage(
"loginMessage",
"Jaza username/email na password.",
"error"
);

return;

}

button.disabled = true;
button.textContent = "Inaingia...";

showAuthMessage(
"loginMessage",
"Inathibitisha taarifa zako...",
"success"
);

try{

const response =
await fetch(
API_BASE + "/login",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
login:login,
password:password
})
}
);

let data;

try{
data = await response.json();
}catch(error){
throw new Error("Server haikurudisha majibu sahihi.");
}

if(!response.ok || !data.success){

showAuthMessage(
"loginMessage",
data.message || "Incorrect username or password.",
"error"
);

button.disabled = false;
button.textContent = "Login";

return;

}

if(!data.user){
throw new Error("Login imefanikiwa lakini API haijarudisha taarifa za mtumiaji.");
}

localStorage.setItem(
"netsimulizi_user",
JSON.stringify(data.user)
);

showAuthMessage(
"loginMessage",
"Login imefanikiwa. Karibu Net Simulizi!",
"success"
);

setTimeout(function(){
closeAuth();
window.location.href = "admin-login.html";
},700);

}catch(error){

showAuthMessage(
"loginMessage",
"Imeshindikana kuwasiliana na Net Simulizi API: " + error.message,
"error"
);

button.disabled = false;
button.textContent = "Login";

}

}

/* =========================
CLOSE MODAL
========================= */

document.getElementById("authModal").addEventListener(
"click",
function(e){
if(e.target === this){
closeAuth();
}
}
);

/* =========================
ENTER KEY
========================= */

document.getElementById("homeLogin").addEventListener(
"keydown",
function(e){
if(e.key === "Enter"){
homeLogin();
}
}
);

document.getElementById("homeLoginPassword").addEventListener(
"keydown",
function(e){
if(e.key === "Enter"){
homeLogin();
}
}
);

/* =========================
PAGE LOAD
========================= */

window.addEventListener(
"DOMContentLoaded",
function(){

const savedLanguage =
localStorage.getItem("netsimulizi_language");

const languageScreen =
document.getElementById("languageScreen");

if(savedLanguage){
if(languageScreen){
languageScreen.classList.add("hidden");
}
showAdminScreen();
}else{
if(languageScreen){
languageScreen.classList.remove("hidden");
}
}

}
);

</script>

</body>
</html>
